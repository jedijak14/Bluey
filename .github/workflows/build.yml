name: Test and build Bluey
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build && npm test
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
      - name: Verify scratch-training math and curriculum
        run: |
          pip install -r training/requirements.txt
          OPENBLAS_NUM_THREADS=1 python -m pytest training/tests -q
      - name: Browser regressions (fixtures, no desktop actions)
        run: |
          set -euo pipefail
          mkdir -p artifacts/native
          node --input-type=module -e 'import fs from "node:fs"; import zlib from "node:zlib"; process.stdout.write(zlib.brotliDecompressSync(fs.readFileSync("node_modules/@sparticuz/chromium/bin/al2023.tar.br")))' | tar -x -C artifacts/native
          export LD_LIBRARY_PATH="$PWD/artifacts/native/lib:${LD_LIBRARY_PATH:-}"
          npm run dev >ui-server.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" || true' EXIT
          npx wait-on --timeout 30000 http://127.0.0.1:5173
          npm run test:ui
          npm run test:device-speech
          npm run test:features
          npm run test:gemma
          npm run test:mobile-site
      - name: Gemma UI and device gate in production build
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/artifacts/native/lib:${LD_LIBRARY_PATH:-}"
          npm run preview -- --port 5174 --strictPort >production-ui.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          npx wait-on --timeout 30000 http://127.0.0.1:5174
          BLUEY_PREVIEW_URL=http://127.0.0.1:5174 npm run test:gemma
          BLUEY_PREVIEW_URL=http://127.0.0.1:5174 npm run test:mobile-site
          BLUEY_PREVIEW_URL=http://127.0.0.1:5174 npm run test:device-speech
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-regression-diagnostics
          path: |
            artifacts/*.png
            ui-server.log
            production-ui.log
  android-apk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Use the hosted runner Android SDK
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          (set +o pipefail; yes | "$sdkmanager" --licenses >/dev/null)
          "$sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee sdk-setup.log
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run android:sync
      - name: Compile and check Android app
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace 2>&1 | tee ../android-build.log
      - name: Prepare native test backend and emulator access
        run: |
          python -m pip install -r backend/requirements.txt
          BLUEY_NATIVE_SMOKE_TEST=1 BLUEY_TOKEN=native-smoke-test-only BLUEY_LAN=1 \
            python -m backend.tests.android_smoke_server >native-smoke-server.log 2>&1 &
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash -o pipefail -c "cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee ../android-native-test.log"
      - name: Verify signed APK and create download files
        run: |
          mkdir -p release/android
          cp android/app/build/outputs/apk/debug/app-debug.apk release/android/Bluey-0.3.0-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/android/Bluey-0.3.0-Android.apk | tee release/android/APK-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release/android/Bluey-0.3.0-Android.apk > release/android/APK-manifest.txt
          (cd release/android && sha256sum Bluey-0.3.0-Android.apk > SHA256SUMS.txt)
          cp docs/ANDROID_RELEASE.md release/android/Android-Setup-Instructions.md
      - uses: actions/upload-artifact@v4
        with:
          name: Bluey-Android-APK
          path: release/android/*
          if-no-files-found: error
      - name: Publish actionable failure details
        if: failure()
        run: |
          python scripts/ci_android_diagnostics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            *-setup.log
            android-*.log
            native-smoke-server.log
          if-no-files-found: ignore
  windows-installer:
    if: "github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[release-android]')"
    timeout-minutes: 25
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify executables and generate checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release/Bluey-*-Windows-x64-*.exe)
          if ($files.Count -ne 2) { throw "Expected both installer and portable executables" }
          $hashes = foreach ($file in $files) {
            if ($file.Length -lt 1000000) { throw "Executable is unexpectedly small: $($file.Name)" }
            $stream = [System.IO.File]::OpenRead($file.FullName)
            try {
              if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw "Missing PE executable header" }
            } finally { $stream.Dispose() }
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $hashes | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Copy-Item docs/RELEASE_NOTES.md release/Windows-Setup-Instructions.md
      - uses: actions/upload-artifact@v4
        with:
          name: Bluey-Windows-executables
          path: |
            release/Bluey-*-Windows-x64-*.exe
            release/SHA256SUMS.txt
            release/Windows-Setup-Instructions.md
          if-no-files-found: error
  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/eb8659fe-bluey' && contains(github.event.head_commit.message, '[release-preview]')
    needs: [android-apk, windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Bluey-Windows-executables
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: Bluey-Android-APK
          path: release/android
      - name: Publish verified PC and Android previews together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          exec > >(tee publish-preview.log) 2>&1
          release_failure() {
            code=$?
            if [ "$code" -ne 0 ]; then
              python -c 'from pathlib import Path; text=Path("publish-preview.log").read_text(errors="replace")[-3500:]; print("::error::Release publication failed: " + text.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A"))'
            fi
            exit "$code"
          }
          trap release_failure EXIT
          mkdir -p release/combined
          cp release/windows/*.exe release/windows/*Instructions.md release/combined/
          cp release/android/*.apk release/android/*Instructions.md release/android/APK-*.txt release/combined/
          (cd release/combined && sha256sum *.exe *.apk > SHA256SUMS.txt)
          tag="v0.3.0-preview.5"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
            gh release upload "$tag" release/combined/* --clobber
          else
            gh release create "$tag" release/combined/* \
              --target "$GITHUB_SHA" --title "Bluey 0.3.0 — Quiet sessions & meeting drafts" \
              --prerelease --notes-file docs/RELEASE_0.3.0.md
          fi
